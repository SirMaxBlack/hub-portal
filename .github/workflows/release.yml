name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify version
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build release archive
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          git archive --format=tar.gz --prefix="hub-portal-${version}/" -o "hub-portal-${version}.tar.gz" HEAD
          sha256sum "hub-portal-${version}.tar.gz" > "hub-portal-${version}.tar.gz.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "${GITHUB_REF_NAME}" \
            "hub-portal-${version}.tar.gz" \
            "hub-portal-${version}.tar.gz.sha256" \
            --generate-notes \
            --title "HUB Portal ${GITHUB_REF_NAME}" \
            --prerelease
